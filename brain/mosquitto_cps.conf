# Configurazione Mosquitto per il laboratorio Work Guardian CPS.
# Senza un "listener" esplicito Mosquitto 2.x parte in "local only mode" e
# accetta solo client da localhost: drone e orologio, che arrivano dall'hotspot,
# verrebbero rifiutati.
#
# Avvio (dalla radice del progetto):
#   mosquitto -c Brain\mosquitto_cps.conf -v

# Ascolta su tutte le interfacce di rete, non solo su 127.0.0.1.
listener 1883 0.0.0.0

# Rete di laboratorio chiusa: nessuna autenticazione. Da non usare su reti
# pubbliche.
allow_anonymous true
