# Impostazioni del broker MQTT
#
# Mosquitto le usa al posto della propria configurazione 
# di sistema solo quando il file gli viene indicato all'avvio con l'opzione -c.
#
# Avvio da PowerShell, nella radice del progetto:
#   & "C:\Program Files\Mosquitto\mosquitto.exe" -c communication\mqtt_broker.conf -v
#
# Con l'opzione -v il broker stampa a schermo le connessioni e i messaggi.

# Apre la porta 1883 su tutte le interfacce di rete del PC, compresa quella del
# tethering USB da cui arriva l'orologio. Senza questa riga Mosquitto accetta
# solo i programmi eseguiti sul PC.
listener 1883 0.0.0.0

# Ammette i client senza nome utente e password, che nessun dispositivo del
# progetto invia. Poiché chiunque raggiunga la porta può collegarsi, il broker
# va avviato solo sulla rete del laboratorio.
allow_anonymous true
