# Impostazioni del broker MQTT.
#
# Il broker si avvia in PowerShell dalla radice del progetto:
#   & "C:\Program Files\Mosquitto\mosquitto.exe" -c communication\mqtt_broker.conf -v
#
# Con l'opzione -c Mosquitto legge questo file al posto delle impostazioni
# predefinite. Con l'opzione -v stampa a schermo ogni connessione e ogni
# messaggio.

# Mette il broker in ascolto sulla porta 1883 di tutte le interfacce di rete del
# PC, compresa la scheda Ethernet attraverso la quale si collega l'orologio.
# Senza questa riga Mosquitto accetta solo le connessioni dal PC stesso.
listener 1883 0.0.0.0

# Ammette i client che si collegano senza nome utente e password, come
# l'orologio e il programma del drone.
allow_anonymous true
